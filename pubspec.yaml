name: is_airlock_api
description: >-
  The airlock's contract: the actions a tool describes, the trajectories they
  are proposed on, and the airlock that decides and records each one.
# Between releases main is `<next>-dev`, so whoever builds on it by path or
# git ref can see it moves; the release commit drops `-dev`.
version: 0.7.1
repository: https://github.com/intersyntactic/airlock_api

environment:
  sdk: ^3.13.0

dependencies:
  is_content_id: ^0.2.0
  # Both: 0.7.0 only adds, and nothing here switches over its new Progress
  # case. is_flight_rules needs 0.7.0, so ^0.6.0 alone kept the two apart.
  is_effects: ">=0.6.0 <0.8.0"
  is_shapes: ^0.5.0

dev_dependencies:
  analyzer: ^14.7.0
  lints: ^6.1.0
  test: ^1.25.0
