name: is_airlock_api
description: >-
  The airlock's contract: the actions a tool describes, the trajectories they
  are proposed on, and the airlock that decides and records each one.
# Between releases main is `<next>-dev`, so whoever builds on it by path or
# git ref can see it moves; the release commit drops `-dev`.
version: 0.7.1
repository: https://github.com/intersyntactic/airlock_api

environment:
  sdk: ^3.13.0

dependencies:
  is_content_id: ^0.2.0
  is_effects: ^0.7.0
  is_shapes: ^0.5.0

# Until is_effects 0.7.0 is on pub.dev: its PR head, AsksTheModel with the
# system prompt (https://github.com/intersyntactic/effects/pull/4). Removed
# before this merges.
dependency_overrides:
  is_effects:
    git:
      url: https://github.com/intersyntactic/effects
      ref: b313ac87188fb553b9a07ad31407dc1de9c4a610

dev_dependencies:
  analyzer: ^14.7.0
  lints: ^6.1.0
  test: ^1.25.0
