name: is_airlock_api
description: >-
  The airlock's contract: the actions a tool describes, the trajectories they
  are proposed on, and the airlock that decides and records each one.
# Between releases main is `<next>-dev`, so whoever builds on it by path or
# git ref can see it moves; the release commit drops `-dev`.
version: 0.26.0
repository: https://github.com/intersyntactic/airlock_api

environment:
  sdk: ^3.13.0

dependencies:
  checked_json: ^0.4.0
  is_content_id: ^0.2.0
  is_conversation_vocabulary: ^0.2.0
  is_file_request_vocabulary: ^0.1.0
  is_model_vocabulary: ^0.5.0
  is_outcome_vocabulary: ^0.1.0
  is_program_request_vocabulary: ^0.1.0
  is_relative_path_vocabulary: ^0.1.0
  is_shapes: ^0.6.0
  is_sign_in_vocabulary: ^0.1.2
  is_web_address_vocabulary: ^0.1.1
  is_web_request_vocabulary: ^0.1.0

dev_dependencies:
  analyzer: ^14.7.0
  lints: ^6.1.0
  test: ^1.25.0
